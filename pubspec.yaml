name: mamam_kasir
description: Mamam Kasir — offline-first multi-branch F&B POS for Mamam Ayam / Mamam Global.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (per architecture doc: Flutter/Dart + Riverpod)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local persistence (encrypted SQLite — sqlcipher via sqflite_sqlcipher)
  sqflite_sqlcipher: ^3.1.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Remote backend
  supabase_flutter: ^2.5.6

  # Secure key storage (OS keystore/keychain, per AGENTS.md security rules)
  flutter_secure_storage: ^9.2.2

  # Lightweight local UI-preference persistence (non-sensitive settings
  # only, e.g. Kasir grid column count) — not for secrets or app data.
  shared_preferences: ^2.3.2

  # IDs or exact-money-safe formatting
  uuid: ^4.4.0
  intl: ^0.19.0

  # Icons — swapped out from the web mockup's lucide-react for Flutter-native equivalents
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
